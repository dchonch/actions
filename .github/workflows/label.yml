---
# Reusable pull request labeler workflow (path-based labels via actions/labeler).
# Call from any repo that has a labeler config at .github/labeler.yml:
#
#   on: pull_request_target
#
#   jobs:
#     label:
#       uses: dchonch/actions/.github/workflows/label.yml@main
#       permissions:
#         contents: read
#         pull-requests: write
#
# To use a different config path or keep manually added labels:
#
#   jobs:
#     label:
#       uses: dchonch/actions/.github/workflows/label.yml@main
#       with:
#         config: ".github/config/label.yml"
#         sync-labels: false
#       permissions:
#         contents: read
#         pull-requests: write
#
# Security: pull_request_target runs with write access, and actions/labeler only reads the
# config from the base branch. Never add steps here that check out or execute the PR's code.

name: Label pull requests

on:
  workflow_call:
    inputs:
      config:
        description: "Path to the labeler config in the calling repo"
        type: string
        default: ".github/labeler.yml"
      sync-labels:
        description: "Remove labels that no longer match the changed files"
        type: boolean
        default: true

jobs:
  label:
    name: Label pull requests
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Run labeler
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ${{ inputs.config }}
          sync-labels: ${{ inputs.sync-labels }}
