---
# Reusable stale issue and pull request workflow.
# Call from any repo:
#
#   on:
#     schedule:
#       - cron: "0 6 * * 1"
#     workflow_dispatch:
#
#   jobs:
#     stale:
#       uses: dchonch/actions/.github/workflows/stale.yml@main
#       permissions:
#         issues: write
#         pull-requests: write
#
# To tune the timings or exempt labels:
#
#   jobs:
#     stale:
#       uses: dchonch/actions/.github/workflows/stale.yml@main
#       with:
#         days-before-stale: 30
#         days-before-close: 14
#         exempt-labels: "pinned,security"
#       permissions:
#         issues: write
#         pull-requests: write

name: Stale issues and pull requests

on:
  workflow_call:
    inputs:
      days-before-stale:
        description: "Days of inactivity before an issue or PR is marked stale"
        type: number
        default: 60
      days-before-close:
        description: "Days after being marked stale before it is closed (-1 to never close)"
        type: number
        default: 7
      exempt-labels:
        description: "Comma-separated labels that exempt issues and PRs from being marked stale"
        type: string
        default: "pinned,security"

jobs:
  stale:
    name: Flag stale issues and pull requests
    runs-on: avrea-ubuntu-latest-2-vcpu
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Run stale
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          exempt-issue-labels: ${{ inputs.exempt-labels }}
          exempt-pr-labels: ${{ inputs.exempt-labels }}
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >-
            This issue has been inactive for ${{ inputs.days-before-stale }} days and will be closed
            in ${{ inputs.days-before-close }} days if there is no further activity.
          stale-pr-message: >-
            This pull request has been inactive for ${{ inputs.days-before-stale }} days and will be closed
            in ${{ inputs.days-before-close }} days if there is no further activity.
          remove-stale-when-updated: true
